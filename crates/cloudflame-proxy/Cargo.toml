[package]
name = "cloudflame-proxy"
version = "0.1.0"
edition = "2021"
authors = ["yvliet <yvliet@users.noreply.github.com>"]
description = "Cloudflame edge security proxy feature ingestion service"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "ingest_benchmark"
harness = false

[profile.test]
opt-level = 2
debug = true

[profile.bench]
opt-level = 3
debug = false
